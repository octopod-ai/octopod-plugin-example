# An Octopod plugin: its tools, served by its MCP server, what the personas using it read, the
# persona it brings and the cron job that persona runs.
name: example
description: An example plugin — the local time anywhere, and greetings in the style of the workspace.
server:
  build: server
  port: 8080
  path: /mcp
params:
  - name: greeting
    description: How to greet, for example Bonjour
instructions: INSTRUCTIONS.md
tools:
  - name: local_time
    description: Tells the current local time in a time zone.
    # Decided before each call: it acts on no resource of Octopod, and only reads.
    access: { resource: none, does: read }
    input_schema:
      type: object
      additionalProperties: false
      required: [timezone]
      properties:
        timezone: { type: string, description: 'IANA time zone, for example Asia/Tokyo.' }
  - name: greet
    description: Greets someone with the greeting of the workspace.
    access: { resource: none, does: read }
    input_schema:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
personas:
  # example-greeter in Octopod: its prompt is personas/greeter.md, its own know-how
  # personas/greeter/skills/. Its grants are generated from what it names here.
  - id: greeter
    tools: [greet, local_time]
    # Why it holds each of its tools (and core_tools): a tool held for no reason is refused.
    reasons:
      greet: greet people with the greeting of the workspace, never one of its own
      local_time: tell the local time where people are, never computed by itself
crons:
  # example.weekly-welcome in Octopod: runs in every workspace where example-greeter works.
  - key: weekly-welcome
    name: Weekly welcome
    schedule: '0 9 * * 1'
    time_zone: Europe/Paris
    persona: greeter
    delivery: message
    prompt: Welcome the workspace to the new week, as your know-how describes it.
